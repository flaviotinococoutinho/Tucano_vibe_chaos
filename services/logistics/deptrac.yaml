# Layer rules for the hexagon inside each feature package (src/<Feature>/...).
# Anything a layer is not allowed to use breaks the build.
deptrac:
  paths:
    - ./app
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^Logistics\\[A-Za-z]+\\Domain\\.*
    - name: Application
      collectors:
        - type: classLike
          value: ^Logistics\\[A-Za-z]+\\Application\\.*
    - name: Adapter
      collectors:
        - type: classLike
          value: ^Logistics\\[A-Za-z]+\\Adapter\\.*
    - name: App
      collectors:
        - type: classLike
          value: ^App\\.*
    - name: SharedKernel
      collectors:
        - type: classLike
          value: ^Tucano\\SharedKernel\\.*
    - name: FeatureFlags
      collectors:
        - type: classLike
          value: ^Tucano\\FeatureFlags\\.*
    - name: Messaging
      collectors:
        - type: classLike
          value: ^Tucano\\(Messaging|ReadModels)\\.*
    - name: Framework
      collectors:
        - type: classLike
          value: ^(Illuminate|Laravel|Symfony|Monolog|Psr)\\.*
    # SDKs and drivers of third parties. Only adapters (and the App wiring) may
    # touch them, so the core never depends on a vendor and swapping one is a
    # change in a single layer.
    - name: Vendor
      collectors:
        - type: classLike
          value: ^(Aws|GuzzleHttp|MongoDB|Ramsey|RdKafka|OpenFeature)\\.*
  ruleset:
    Domain:
      - SharedKernel
    # The use cases ask their ports; flags, brokers and SDKs answer from the adapters.
    Application:
      - Domain
      - SharedKernel
    Adapter:
      - Application
      - Domain
      - SharedKernel
      - FeatureFlags
      - Messaging
      - Framework
      - Vendor
    App:
      - Adapter
      - Application
      - Domain
      - SharedKernel
      - FeatureFlags
      - Messaging
      - Framework
      - Vendor
