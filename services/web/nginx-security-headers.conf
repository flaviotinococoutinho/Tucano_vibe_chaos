# Included by every location of nginx.conf: nginx only inherits add_header from its parent
# context when the location defines none of its own, and both locations need one (the cache
# policy differs between them), so the shared headers live here instead of being repeated.
#
# default-src 'self' with only what the app actually loads: its own bundle, its own self-hosted
# font, its own icons and illustrations, and its own /bff/v1 calls. No inline script or style is
# ever emitted, so neither needs 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
