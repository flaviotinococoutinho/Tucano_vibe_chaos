# Serves the built SPA. Unlike the other services, this nginx has no upstream to proxy to:
# the browser calls /bff/v1/... directly, and Kong (not this container) routes that to the
# BFF, on the same origin the page was served from.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes every file under assets/ (the JS bundle, the CSS, the self-hosted
    # font): the same URL never serves different bytes, so it is safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else: the SPA shell and the icons, manifest and illustrations copied verbatim
    # from public/. None of it is content-hashed, so it is revalidated on every request instead.
    # A path with no matching file (a browser route like /products/BOOK-DDD-001) falls back to
    # index.html, and the app itself takes it from there.
    location / {
        include /etc/nginx/snippets/nginx-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
