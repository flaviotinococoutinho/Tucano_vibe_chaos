name: chaos-playground

# Shared defaults: rotated logs and automatic restarts for long-running containers.
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# One-shot jobs (topic creation, flag bootstrap) run once and exit.
x-job: &job
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "1m"
      max-file: "1"

x-catalog: &catalog
  build:
    context: .
    dockerfile: services/catalog/Dockerfile
  image: chaos-playground/catalog
  environment:
    APP_NAME: catalog
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: "false"
    LOG_LEVEL: info
    DB_HOST: toxiproxy
    DB_PORT: "13306"
    DB_DATABASE: catalog
    DB_USERNAME: catalog
    DB_PASSWORD: catalog
    REDIS_HOST: toxiproxy
    REDIS_PORT: "16379"
    FLAGD_HOST: toxiproxy
    FLAGD_PORT: "18013"
    KAFKA_BROKERS: toxiproxy:19092
    KAFKA_MESSAGE_TIMEOUT_MS: "5000"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    toxiproxy:
      condition: service_started
    flagd:
      condition: service_started
  networks: [backend]

x-commerce: &commerce
  build:
    context: .
    dockerfile: services/commerce/Dockerfile
  image: chaos-playground/commerce
  environment:
    APP_NAME: commerce
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: base64:Hw0CB0x2Y7m9xvZcGf8Lh1u8mQ4vJ3kP2sT6yR5nE1A=
    APP_DEBUG: "false"
    LOG_LEVEL: info
    DB_HOST: toxiproxy
    DB_PORT: "15432"
    DB_DATABASE: commerce
    DB_USERNAME: commerce
    DB_PASSWORD: commerce
    REDIS_HOST: toxiproxy
    REDIS_PORT: "16379"
    FLAGD_HOST: toxiproxy
    FLAGD_PORT: "18013"
    SNOWFLAKE_DATACENTER_ID: "1"
    SNOWFLAKE_WORKER_ID: "1"
    MONGO_URI: mongodb://toxiproxy:17017/?directConnection=true
    MONGO_DATABASE: commerce_read
    KAFKA_BROKERS: toxiproxy:19092
    PAYFAKE_URL: http://toxiproxy:14001
    PAYFAKE_WEBHOOK_SECRET: whsec_local_payfake
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    toxiproxy:
      condition: service_started
    flagd:
      condition: service_started
  networks: [backend]

x-logistics: &logistics
  build:
    context: .
    dockerfile: services/logistics/Dockerfile
  image: chaos-playground/logistics
  environment: &logistics-env
    APP_NAME: logistics
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: base64:Jf5wQm2Xk8Rz4Tn7Vb1Yc3Ud6He9Lg0Pa5Sq2Wx8Zr4=
    APP_DEBUG: "false"
    LOG_LEVEL: info
    DB_HOST: toxiproxy
    DB_PORT: "15433"
    DB_DATABASE: logistics
    DB_USERNAME: logistics
    DB_PASSWORD: logistics
    REDIS_HOST: toxiproxy
    REDIS_PORT: "16379"
    FLAGD_HOST: toxiproxy
    FLAGD_PORT: "18013"
    SNOWFLAKE_DATACENTER_ID: "1"
    SNOWFLAKE_WORKER_ID: "11"
    MONGO_URI: mongodb://toxiproxy:17017/?directConnection=true
    MONGO_DATABASE: logistics_read
    KAFKA_BROKERS: toxiproxy:19092
    # Floci plays S3 (the label bucket) and SQS (the label queue).
    AWS_ENDPOINT: http://toxiproxy:14566
    SQS_PREFIX: http://toxiproxy:14566/000000000000
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    toxiproxy:
      condition: service_started
    flagd:
      condition: service_started
  networks: [backend]

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 60s
  start_interval: 2s

services:
  # ---------------------------------------------------------------- data stores

  postgres:
    <<: *service
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=60
      -c log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
    mem_limit: 256m
    networks: [backend]

  mysql:
    <<: *service
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-name-resolve
      - --max-connections=60
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
    mem_limit: 512m
    networks: [backend]

  mongo:
    <<: *service
    image: mongo:8.0
    # Single-node replica set: needed for transactions and change streams.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      <<: *healthcheck
      # Initiates the replica set on first boot and reports healthy only once this node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
    mem_limit: 512m
    networks: [backend]

  redis:
    <<: *service
    image: redis:8-alpine
    # volatile-lru evicts only keys with a TTL (cache), never locks or GEO data.
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    mem_limit: 128m
    networks: [backend]

  # ------------------------------------------------------------------ messaging

  zookeeper:
    <<: *service
    image: apache/kafka:3.9.2
    command: ["/opt/kafka/bin/zookeeper-server-start.sh", "/etc/kafka/zookeeper.properties"]
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx64m
    volumes:
      - ./infra/zookeeper/zookeeper.properties:/etc/kafka/zookeeper.properties:ro
      - zookeeper-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:2181:2181"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
    mem_limit: 192m
    networks: [backend]

  kafka:
    <<: *service
    image: apache/kafka:3.9.2
    command: ["/opt/kafka/bin/kafka-server-start.sh", "/etc/kafka/server.properties"]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./infra/kafka/server.properties:/etc/kafka/server.properties:ro
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "nc -z localhost 9092"]
    mem_limit: 640m
    networks: [backend]

  kafka-init:
    <<: *job
    image: apache/kafka:3.9.2
    command: ["/opt/kafka/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/opt/kafka/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend]

  # ------------------------------------------------------------------ local aws

  floci:
    <<: *service
    image: floci/floci:2.1.0-compat
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_SERVICES_SES_SMTP_HOST: mailpit
      FLOCI_SERVICES_SES_SMTP_PORT: "1025"
    volumes:
      - floci-data:/app/data
      - ./infra/floci/ready.d:/etc/floci/init/ready.d:ro
      - ./infra/floci/dynamodb:/etc/floci/dynamodb:ro
      - ./infra/floci/healthcheck.sh:/usr/local/bin/ready-check.sh:ro
    ports:
      - "127.0.0.1:4566:4566"
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/ready-check.sh"]
    mem_limit: 256m
    networks: [backend]

  mailpit:
    <<: *service
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 64m
    networks: [backend]

  # -------------------------------------------------------- chaos and flags

  toxiproxy:
    <<: *service
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    mem_limit: 64m
    networks: [edge, backend]

  flags-init:
    <<: *job
    image: alpine:3
    network_mode: none
    # flagd serves a single runtime copy of the environment file. The chaos panel edits
    # that copy in place, and every `make up` starts again from the versioned file.
    command:
      - sh
      - -c
      - cp /environments/${APP_ENV:-local}.flagd.json /runtime/flags.flagd.json && chmod 0666 /runtime/flags.flagd.json
    volumes:
      - ./infra/flags/environments:/environments:ro
      - flag-runtime:/runtime

  flagd:
    <<: *service
    image: ghcr.io/open-feature/flagd:v0.17.0
    command: ["start", "--uri", "file:/flags/runtime/flags.flagd.json"]
    volumes:
      - flag-runtime:/flags/runtime:ro
    ports:
      - "127.0.0.1:8013:8013"
      - "127.0.0.1:8016:8016"
    depends_on:
      flags-init:
        condition: service_completed_successfully
    mem_limit: 64m
    networks: [backend]

  # ----------------------------------------------------------------------- edge

  kong:
    <<: *service
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "kong", "health"]
    mem_limit: 256m
    networks: [edge, backend]

  # ------------------------------------------------------------- php runtime

  nginx:
    <<: *service
    image: nginx:stable-alpine
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
    mem_limit: 64m
    networks: [backend]

  # ------------------------------------------------------------------- services

  catalog-migrate:
    <<: [*job, *catalog]
    # Runs once before the API starts, like a Kubernetes Job: schema, seeds, and every
    # published product on the compacted topic, so a new consumer finds the whole catalog.
    command: ["sh", "-c", "php artisan migrate --force --seed && php artisan catalog:republish"]

  catalog:
    <<: [*service, *catalog]
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
    mem_limit: 256m

  commerce-migrate:
    <<: [*job, *commerce]
    # Runs once before the API starts, like a Kubernetes Job: SQL schema and seeds, then the read models.
    command: ["sh", "-c", "php artisan migrate --force --seed && php artisan mongo:migrate"]

  commerce:
    <<: [*service, *commerce]
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
    mem_limit: 256m

  # Workers: the same image, one long-running command each, stopped with SIGTERM.
  commerce-outbox-relay:
    <<: [*service, *commerce]
    command: ["php", "artisan", "commerce:relay-outbox"]
    # The base image stops PHP-FPM with SIGQUIT; the workers finish their batch on SIGTERM.
    stop_signal: SIGTERM
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    mem_limit: 128m

  commerce-catalog-sync:
    <<: [*service, *commerce]
    command: ["php", "artisan", "commerce:sync-catalog"]
    stop_signal: SIGTERM
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    mem_limit: 128m

  commerce-order-expiry:
    <<: [*service, *commerce]
    command: ["php", "artisan", "commerce:expire-orders"]
    stop_signal: SIGTERM
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    mem_limit: 128m

  commerce-payment-reconciler:
    <<: [*service, *commerce]
    command: ["php", "artisan", "commerce:reconcile-payments"]
    stop_signal: SIGTERM
    depends_on:
      commerce-migrate:
        condition: service_completed_successfully
      # The circuit breaker of the provider lives in Redis, shared with the API.
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    mem_limit: 128m

  logistics-migrate:
    <<: [*job, *logistics]
    # Runs once before the API starts, like a Kubernetes Job: SQL schema and seeds, then the read models.
    command: ["sh", "-c", "php artisan migrate --force --seed && php artisan mongo:migrate"]

  logistics:
    <<: [*service, *logistics]
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
    mem_limit: 256m

  # Workers: the same image, one long-running command each, stopped with SIGTERM.
  logistics-outbox-relay:
    <<: [*service, *logistics]
    command: ["php", "artisan", "logistics:relay-outbox"]
    stop_signal: SIGTERM
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    mem_limit: 128m

  logistics-catalog-sync:
    <<: [*service, *logistics]
    command: ["php", "artisan", "logistics:sync-catalog"]
    stop_signal: SIGTERM
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    mem_limit: 128m

  logistics-order-intake:
    <<: [*service, *logistics]
    command: ["php", "artisan", "logistics:order-intake"]
    stop_signal: SIGTERM
    environment:
      # Merge keys are shallow: the whole environment comes back, with the worker's own Snowflake id.
      <<: *logistics-env
      SNOWFLAKE_WORKER_ID: "12"
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    mem_limit: 128m

  # Kafka is the log, SQS the work queue: this bridge turns every ShipmentCreated into a label job.
  logistics-label-requests:
    <<: [*service, *logistics]
    command: ["php", "artisan", "logistics:request-labels"]
    stop_signal: SIGTERM
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      floci:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    mem_limit: 128m

  # Laravel's queue worker on label-jobs. It finishes the current job on SIGTERM, and
  # --max-time recycles it every hour; the restart policy brings it back.
  logistics-label-worker:
    <<: [*service, *logistics]
    # --quiet: the job logs its outcome in JSON, like every other line of the stack.
    command: ["php", "artisan", "queue:work", "sqs", "--queue=label-jobs", "--sleep=3", "--max-time=3600", "--quiet"]
    stop_signal: SIGTERM
    depends_on:
      logistics-migrate:
        condition: service_completed_successfully
      floci:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    mem_limit: 128m

  tracking:
    <<: *service
    build:
      context: .
      dockerfile: services/tracking/Dockerfile
    image: chaos-playground/tracking
    environment:
      APP_NAME: tracking
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: info
      SWOOLE_WORKERS: "2"
      REDIS_HOST: toxiproxy
      REDIS_PORT: "16379"
      FLAGD_HOST: toxiproxy
      FLAGD_PORT: "18013"
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      flagd:
        condition: service_started
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9501/health/ready"]
    mem_limit: 128m
    networks: [backend]

  bff:
    <<: *service
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    image: chaos-playground/bff
    environment:
      SERVICE_NAME: bff
      APP_ENV: ${APP_ENV:-local}
      PORT: "3000"
      LOG_LEVEL: info
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health/ready"]
    mem_limit: 96m
    networks: [edge, backend]

  # The outside world: only on edge, and the services reach it through Toxiproxy (payfake, carriers).
  partners-sim:
    <<: *service
    build:
      context: .
      dockerfile: services/partners-sim/Dockerfile
    image: chaos-playground/partners-sim
    environment:
      SERVICE_NAME: partners-sim
      APP_ENV: ${APP_ENV:-local}
      PORT: "4000"
      LOG_LEVEL: info
      PAYFAKE_WEBHOOK_URL: http://kong:8000/api/commerce/v1/webhooks/payfake
      PAYFAKE_WEBHOOK_SECRET: whsec_local_payfake
      PAYFAKE_PROCESSING_MIN_MS: "300"
      PAYFAKE_PROCESSING_MAX_MS: "1500"
    # The chaos controls of PayFake, from the host.
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4000/health/ready"]
    mem_limit: 96m
    networks: [edge]

  # ---------------------------------------------------------- tools (profile)

  kafka-ui:
    <<: *service
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xms64m -Xmx192m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 320m
    networks: [backend]

  adminer:
    <<: *service
    image: adminer:6.1.1
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8088:8080"
    mem_limit: 64m
    networks: [backend]

  dynamodb-admin:
    <<: *service
    image: aaronshaf/dynamodb-admin:5.3.4
    profiles: [tools]
    environment:
      DYNAMO_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:8089:8001"
    depends_on:
      floci:
        condition: service_healthy
    mem_limit: 128m
    networks: [backend]

networks:
  edge:
  backend:

volumes:
  postgres-data:
  mysql-data:
  mongo-data:
  redis-data:
  zookeeper-data:
  kafka-data:
  floci-data:
  flag-runtime:
