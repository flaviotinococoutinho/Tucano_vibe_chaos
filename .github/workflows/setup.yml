name: setup

# The whole Ansible setup on a clean Ubuntu runner: it installs what is missing, builds and
# starts the stack, and asks every service whether it is ready. Proof that a new machine gets
# to a healthy stack with one command. Manual, because it takes a while.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The images and the volumes need more room than a fresh runner has free.
      - name: Make room on the disk of the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Ansible
        run: pipx install --force --include-deps ansible
      - name: Prepare the machine and bring the stack up
        working-directory: infra/ansible
        run: ansible-playbook playbooks/setup.yml
      # What compose records on each container: the hash of its config and the image it runs.
      - name: Remember what the first run left running
        run: |
          docker ps -a --format '{{.Names}}' | sort | xargs docker inspect --format \
            '{{.Name}} {{.Id}} {{index .Config.Labels "com.docker.compose.config-hash"}} {{.Image}}' > "$RUNNER_TEMP/first.txt"
      - name: A second run changes nothing and the stack is still healthy
        working-directory: infra/ansible
        run: |
          ansible-playbook playbooks/setup.yml | tee "$RUNNER_TEMP/second-run.txt"
          grep -Eq 'changed=0 ' "$RUNNER_TEMP/second-run.txt"
      - name: What the second run recreated, and why
        if: always()
        run: |
          docker version --format 'engine {{.Server.Version}}, compose '"$(docker compose version --short)"
          docker info --format 'storage {{.Driver}}, image store {{range .DriverStatus}}{{.}} {{end}}'
          docker ps -a --format '{{.Names}}' | sort | xargs docker inspect --format \
            '{{.Name}} {{.Id}} {{index .Config.Labels "com.docker.compose.config-hash"}} {{.Image}}' > "$RUNNER_TEMP/second.txt"
          # Same container id: kept. Other id with the same config hash and image: recreated for another reason.
          join <(sort "$RUNNER_TEMP/first.txt") <(sort "$RUNNER_TEMP/second.txt") | awk '
            $2 == $5 { next }
            { print $1, ($3 != $6 ? "config changed" : "same config"), ($4 != $7 ? "image changed" : "same image") }'
      - name: Containers
        if: always()
        run: docker compose ps -a
      - name: Logs of what did not come up
        if: failure()
        run: docker compose logs --tail 60
