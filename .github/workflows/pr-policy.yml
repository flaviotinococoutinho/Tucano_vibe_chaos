name: pr-policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow and title
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          release='^release/[0-9]+\.[0-9]+\.[0-9]+$'
          maintenance='^(hotfix|docs|chore|ci)/.+$'

          case "$BASE_REF" in
            develop)
              # Git already validates branch names; prefixes are a convention here.
              ;;
            main)
              [[ "$HEAD_REF" =~ $release || "$HEAD_REF" =~ $maintenance ]] \
                || fail "Use release/x.y.z, hotfix/*, docs/*, chore/* or ci/* to target main; send feature work to develop."
              ;;
            *)
              fail "Pull requests must target develop or main, not '$BASE_REF'."
              ;;
          esac

          [[ "$TITLE" =~ [^[:space:]] ]] || fail "PR title must not be blank."

          # Descriptive titles in Portuguese or English are welcome. Conventional
          # Commits help readers, but formatting alone must not block a change.
          conventional='^(feat|fix|chore|docs|test|refactor|perf|ci|build|revert)(\([^()]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $conventional ]]; then
            echo "::notice::Conventional Commits are recommended for PR titles, but optional."
          fi

          echo "ok: $HEAD_REF -> $BASE_REF"

      # Lives here on purpose: a broken ci.yml cannot run to report itself.
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
