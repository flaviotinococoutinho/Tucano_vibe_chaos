name: pr-policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow and title
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          work='^(feat|fix|chore)/[a-z0-9][a-z0-9._-]*$'
          release='^release/[0-9]+\.[0-9]+\.[0-9]+$'
          hotfix='^hotfix/[a-z0-9][a-z0-9._-]*$'

          case "$BASE_REF" in
            develop)
              [[ "$HEAD_REF" =~ $work || "$HEAD_REF" =~ $release || "$HEAD_REF" =~ $hotfix || "$HEAD_REF" == "main" ]] \
                || fail "'$HEAD_REF' can't target develop. Use feat/, fix/ or chore/ (or a release/hotfix back-merge)."
              ;;
            main)
              [[ "$HEAD_REF" =~ $release || "$HEAD_REF" =~ $hotfix ]] \
                || fail "Only release/x.y.z and hotfix/* can target main."
              ;;
            *)
              fail "Pull requests must target develop or main, not '$BASE_REF'."
              ;;
          esac

          conventional='^(feat|fix|chore|docs|test|refactor|perf|ci|build|revert)(\([a-z0-9-]+\))?!?: .+'
          [[ "$TITLE" =~ $conventional ]] \
            || fail "PR title must follow Conventional Commits, e.g. 'feat(logistics): add carrier selection chain'."

          echo "ok: $HEAD_REF -> $BASE_REF"
