server {
    listen 8082;

    location / {
        set $upstream commerce:9000;
        fastcgi_pass $upstream;
        include fastcgi_params;

        # nginx does not have the code: every request goes to the front controller.
        fastcgi_param SCRIPT_FILENAME /srv/services/commerce/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /srv/services/commerce/public;

        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 30s;
    }
}

# The public face of commerce, the only one Kong reaches (ADR 0030). It serves what a browser, a
# lab or a partner may call (orders, their payments, the PSP webhook, health) and nothing else:
# the customer routes exist only on 8082, which the BFF reaches on the internal network. The
# check runs on the decoded, normalized path, so an encoded slash (/v1%2Fcustomers) cannot sneak
# a customer route in, and PHP routes the very path the check saw.
server {
    listen 8182;

    location ~ ^/(health/(live|ready)$|v1/orders$|v1/orders/[^/]+$|v1/orders/[^/]+/payments$|v1/webhooks/payfake$) {
        set $upstream commerce:9000;
        fastcgi_pass $upstream;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $uri$is_args$args;

        fastcgi_param SCRIPT_FILENAME /srv/services/commerce/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /srv/services/commerce/public;

        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 30s;
    }

    location / {
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Not a public route of commerce."}';
    }
}
