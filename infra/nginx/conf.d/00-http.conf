# Shared http-level settings for the PHP-FPM apps.

log_format json escape=json '{"time":"$time_iso8601","service":"nginx","host":"$server_port",'
                            '"method":"$request_method","uri":"$request_uri","status":$status,'
                            '"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
                            '"correlation_id":"$http_x_correlation_id"}';
access_log /dev/stdout json;

# Docker's embedded DNS. Upstreams are set through variables below, so nginx
# starts even when an app is down and re-resolves the name after it restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;
client_max_body_size 2m;

server {
    listen 8080;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
