# Kafka 3.9 broker in ZooKeeper mode.

broker.id=1
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

# Three listeners, because each client reaches the broker through a different address:
#   INTERNAL  broker traffic and tools inside the compose network (kafka:9092)
#   PROXIED   application clients; advertised as toxiproxy:19092 so chaos experiments
#             can slow down or cut Kafka traffic without touching the broker
#   EXTERNAL  clients on the host machine (localhost:29092)
# A client always reconnects to the advertised address it receives in the metadata,
# which is why each listener advertises the address its clients can resolve.
listeners=INTERNAL://0.0.0.0:9092,PROXIED://0.0.0.0:19093,EXTERNAL://0.0.0.0:29092
advertised.listeners=INTERNAL://kafka:9092,PROXIED://toxiproxy:19092,EXTERNAL://localhost:29092
listener.security.protocol.map=INTERNAL:PLAINTEXT,PROXIED:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL

log.dirs=/var/lib/kafka/data

# One broker: every replication factor is 1. The cluster overlay raises these.
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
# The default of 50 partitions is sized for big clusters; 3 is plenty for one broker.
offsets.topic.num.partitions=3
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Topics are created explicitly (infra/kafka/create-topics.sh), never by accident.
auto.create.topics.enable=false

log.retention.hours=168
log.segment.bytes=104857600
group.initial.rebalance.delay.ms=0
