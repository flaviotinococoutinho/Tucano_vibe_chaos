_format_version: "3.0"

# Routes are added as each service comes online. Global plugins apply to all of them.
plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

services:
  - name: bff
    url: http://bff:3000
    routes:
      - name: bff-api
        paths: [/bff]
        strip_path: true

  - name: catalog
    url: http://nginx:8081
    routes:
      - name: catalog-api
        paths: [/api/catalog]
        strip_path: true

  # The edge reaches commerce on 8182, the nginx listener that serves only its public routes
  # (orders, payments, the PSP webhook, health). The customer routes live on 8082, which only the
  # BFF reaches on the internal network (ADR 0030). A path rule here would not do: Kong matches
  # the raw path, so /api/commerce/v1%2Fcustomers slipped past one and nginx decoded it.
  - name: commerce
    url: http://nginx:8182
    routes:
      - name: commerce-api
        paths: [/api/commerce]
        strip_path: true

  - name: logistics
    url: http://nginx:8083
    routes:
      - name: logistics-api
        paths: [/api/logistics]
        strip_path: true

  - name: tracking
    url: http://tracking:9501
    routes:
      - name: tracking-api
        paths: [/api/tracking]
        strip_path: true

  # The catch-all: Kong routes by the longest matching path, so this never shadows /bff or /api/*.
  - name: web
    url: http://web:80
    routes:
      - name: web-app
        paths: [/]
        strip_path: false
