# Single ZooKeeper node coordinating the Kafka broker.
# Kafka 3.9 is the last release line that still supports ZooKeeper mode.

clientPort=2181
tickTime=2000
initLimit=10
syncLimit=5
maxClientCnxns=60

# The apache/kafka image only ships this directory writable by appuser,
# so ZooKeeper keeps its snapshots and transaction log here.
dataDir=/var/lib/kafka/data
autopurge.snapRetainCount=3
autopurge.purgeInterval=1

# No embedded Jetty admin server; four-letter words are enough for health checks.
admin.enableServer=false
4lw.commands.whitelist=ruok,srvr,stat,mntr,cons
