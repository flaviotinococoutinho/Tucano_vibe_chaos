[global]
error_log = /proc/self/fd/2
log_level = warning

[www]
listen = 9000

; Each child holds one request at a time (shared-nothing): 6 children means
; at most 6 concurrent requests per container, which also caps memory.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Last line of defense for a child stuck on a dependency. max_execution_time counts
; only CPU time on Linux, and a process blocked on the network spends none.
request_terminate_timeout = 30s

; nginx already logs every request.
access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
